# Clasificador IA — dos contenedores desde la misma imagen.
#   worker → backend: clasifica en loop (según MODO de .env)
#   panel  → frontend: web de revisión en http://localhost:8800
#
# Local:            docker compose up --build
# En gestor_oc:     docker compose up -d --build
#
# La base de datos NO va en contenedor: es el MySQL del servidor clásico
# (10.0.0.69), al que ambos servicios se conectan según .env.

# Logging driver compartido — json-file con rotación nativa de Docker. Sin esto,
# los logs de los containers crecen sin límite y se llenan /var/lib/docker. Con
# max-size=20m y max-file=3 cada container nunca pasa de 60 MB total.
x-logging: &log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  worker:
    build: .
    image: clasificador-ia:latest
    command: python worker.py
    env_file: .env
    # /app/reportes: salida de reporte_diario / reporte_semanal /
    # reporte_corregidas. Compartido con panel (que los expone vía /reportes)
    # y persistido en el host para sobrevivir recreates de container.
    volumes:
      - /opt/ia-mp/reportes:/app/reportes
    restart: unless-stopped
    logging: *log

  panel:
    build: .
    image: clasificador-ia:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8800
    env_file: .env
    ports:
      - "8800:8800"
    # Carpeta de trabajo de los módulos Legacy: la misma que usaba Laravel en
    # gestor_oc (chunks, .log, reportes). En el host vive aquí desde siempre.
    # /app/pending: outbox de aprobaciones que NO pudieron escribirse a clásico
    # (BD caída) — el JSON queda en disco hasta que cron/botón lo reintenta.
    # NADA de lo que el revisor aprueba se pierde aunque MySQL esté caído.
    # /app/reportes: mismos archivos que escribe el worker — el panel los lista.
    volumes:
      - /var/www/html/gestor_oc/storage/app/temp:/host/storage/temp
      - /opt/ia-mp/pending:/app/pending
      - /opt/ia-mp/reportes:/app/reportes
    environment:
      LEGACY_TEMP_DIR: /host/storage/temp
    # www-data del host (UID:GID 33:33) es el dueño-de-grupo del directorio
    # /var/www/html/gestor_oc/storage/app/temp (modo 2775 con setgid). Correr
    # el panel con ese UID le da permiso de escritura sin tocar el host.
    user: "33:33"
    depends_on:
      - worker
    restart: unless-stopped
    logging: *log

  # Backtest CONTINUO — DESHABILITADO 2026-06-08. Estaba gastando ~$15-25/día
  # ($160 acumulado desde may-22) llamando a Claude para medir IA vs humano
  # cada 15 min. Era invisible en clasificador_ia_log (guarda en
  # clasificador_ia_backtest). Yoryet pidió: backtests masivos/mensuales SIN
  # gastar API. Sustitución pendiente: backtest_sin_claude.py que mide solo
  # las ramas deterministas (cruce/regla/modelos/vetos) y skipea Claude.
  #
  # Para REACTIVAR temporalmente (CUIDADO con el gasto):
  #   docker compose --profile backtest up -d backtest
  # Para activarlo permanente: cambiar `profiles: [backtest]` por restart.
  #
  # TOPE DE GASTO 2026-06-08: INTERVALO 21600s (6h) + LOTE 100 mantiene el
  # backtest en ~$7-10/semana (vs $15-25/día con INTERVALO 900s + LOTE 200).
  # Cálculo: 4 ciclos/día × 100 filas × 2 tablas × ~25% a Claude × $0.005 =
  # ~$1.0/día = $7/semana. Ajustar aquí si Anthropic cambia precio o cambia
  # la mezcla de ramas (más ramas baratas = menos llamadas Claude).
  backtest:
    build: .
    image: clasificador-ia:latest
    command: python worker.py
    env_file: .env
    environment:
      MODO: test
      INTERVALO_SEGUNDOS: "21600"   # 6 horas (era 15 min)
      LOTE_MAX: "100"               # 100 por tabla (era 200)
    profiles: ["backtest"]   # NO arranca por defecto
    logging: *log
