# Panel de revisión de la Fase 2 publicado en https://device.pharmatender.cl
#
# Vhost PROPIO en gestor_oc. No toca el de iabot (fase 1) ni el de phpmyadmin
# (sólo VPN). Copia instalada en /etc/nginx/sites-available/device (+ symlink en
# sites-enabled). El límite de intentos de login vive en
# /etc/nginx/conf.d/ia-mp-fase2-limites.conf (contexto http):
#
#     map $request_method $f2_login_clave { POST $binary_remote_addr; default ""; }
#     limit_req_zone $f2_login_clave zone=f2_login:10m rate=10r/m;
#
# Certificado: certbot en modo webroot (no edita archivos de nginx) y recarga al renovar:
#     certbot certonly --webroot -w /var/www/html -d device.pharmatender.cl \
#         --deploy-hook "systemctl reload nginx"
# Para el primer certificado se instala sólo el bloque del puerto 80.
#
# Apagar la publicación: rm /etc/nginx/sites-enabled/device && nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name device.pharmatender.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name device.pharmatender.cl;

    ssl_certificate /etc/letsencrypt/live/device.pharmatender.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/device.pharmatender.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/device.access.log;
    error_log /var/log/nginx/device.error.log;

    client_max_body_size 2M;
    proxy_read_timeout 120s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fuerza bruta: 10 POST de login por minuto por IP (ráfaga de 5), el resto 429.
    location = /login {
        limit_req zone=f2_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8810;
    }
    location / {
        proxy_pass http://127.0.0.1:8810;
    }
}
